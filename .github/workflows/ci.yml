name: CI

on:
  push:
    branches: [main, feat/us-production-ready]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:catalog
      - run: npm run check:i18n
      - run: npm run build
      - run: npm run check:export
